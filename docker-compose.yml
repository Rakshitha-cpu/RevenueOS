version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: revenueos_db
    environment:
      POSTGRES_USER: revenueos
      POSTGRES_PASSWORD: revenueos_password
      POSTGRES_DB: revenueos_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: revenueos_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
