name: RevenueOS Enterprise CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  backend-automated-tests:
    name: Backend Pytest Suite & SAST Security Scan
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    steps:
    - uses: actions/checkout@v3
    - name: Set up Python 3.11
      uses: actions/setup-python@v4
      with:
        python-version: "3.11"
        cache: 'pip'
    - name: Install Pinned Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    - name: Run Backend Pytest Suite
      run: |
        python -m unittest tests/test_compliance_guard.py

  frontend-automated-tests:
    name: Frontend Vitest Suite & Build Validation
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
    - uses: actions/checkout@v3
    - name: Setup Node.js 18.x
      uses: actions/setup-node@v3
      with:
        node-version: 18.x
        cache: 'npm'
        cache-dependency-path: ./frontend/package-lock.json
    - name: Install dependencies
      run: npm ci --legacy-peer-deps || npm install --legacy-peer-deps
    - name: Run Vitest Unit Tests
      run: npx vitest run tests/revenueos.test.ts
    - name: Next.js Production Build Validation
      run: npm run build

  docker-container-build:
    name: Multi-Stage Container Image Build
    runs-on: ubuntu-latest
    needs: [backend-automated-tests, frontend-automated-tests]
    steps:
    - uses: actions/checkout@v3
    - name: Build Backend Container
      run: docker build -t revenueos-backend:latest ./backend
    - name: Build Frontend Container
      run: docker build -t revenueos-frontend:latest ./frontend