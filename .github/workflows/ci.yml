name: RevenueOS Enterprise CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  backend-qa-and-sast:
    name: Backend Pytest Suite, SAST Security & Linting
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    steps:
    - uses: actions/checkout@v3
    - name: Set up Python 3.11
      uses: actions/setup-python@v4
      with:
        python-version: "3.11"
        cache: 'pip'
    - name: Install Pinned Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    - name: Run Backend Pytest Suite
      run: pytest -v tests/

  frontend-qa-and-build:
    name: Frontend Vitest Suite & Production Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
    - uses: actions/checkout@v3
    - name: Setup Node.js 18.x
      uses: actions/setup-node@v3
      with:
        node-version: 18.x
        cache: 'npm'
        cache-dependency-path: ./frontend/package-lock.json
    - name: Install Dependencies
      run: npm install --legacy-peer-deps
    - name: Run Vitest Suite
      run: npx vitest run
    - name: Next.js Production Build Validation
      run: npm run build

  docker-image-build:
    name: Multi-Stage Production Container Build
    runs-on: ubuntu-latest
    needs: [backend-qa-and-sast, frontend-qa-and-build]
    steps:
    - uses: actions/checkout@v3
    - name: Build Backend Docker Image
      run: docker build -t revenueos-backend:latest ./backend
    - name: Build Frontend Docker Image
      run: docker build -t revenueos-frontend:latest ./frontend